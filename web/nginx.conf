server {
    listen 80;
    server_name tessera.herbievine.com;
    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints these, so a given URL's contents never change and the
    # browser should never ask about them again.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The entry point and the service worker are the only things that point at
    # a new build, so they must be revalidated every load. Without this a
    # browser can keep serving a cached shell - and its precached bundle -
    # long after a deploy, which looks exactly like the deploy not working.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name api.tessera.herbievine.com;

    location / {
        proxy_pass http://api:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
